# Screenshot definitions for the Compressatorium Web UI, taken with
# shot-scraper (https://shot-scraper.datasette.io/) and regenerated by the
# "Take screenshots" GitHub Actions workflow (.github/workflows/screenshots.yml).
#
# The workflow builds the Svelte frontend, boots the FastAPI backend against a
# throwaway fixture volume (scripts/make_screenshot_fixture.sh), then runs
# `shot-scraper multi shots.yml`. Outputs land in docs/screenshots/ and are
# referenced from README.md and docs/.
#
# Theme control: the UI stores its light/dark preference in the
# `theme-preference` localStorage key (mode-watcher). Setting the key and
# dispatching a `storage` event flips the theme reactively before capture, so
# each surface is shot as a light / dark pair. Theme-only shots share the JS via
# the &js_theme_light / &js_theme_dark YAML anchors defined below (anchors expand
# at parse time, so both PyYAML and `shot-scraper multi` see the full script);
# the batch / Dolphin / 3DS shots keep inline JS because they append interaction
# steps after the theme flip.
#
# Each URL carries a unique `?s=` query so every shot is a full page load rather
# than a same-document hash change (the app is a hash-router SPA). The server is
# expected on http://127.0.0.1:8099 (see the workflow). Views are addressed
# through the hash router: #/workspace/<tool>, #/dashboard, #/dat, #/help.

# --- Workspace: CHDMAN (default tool, Arcade CHD volume) -------------------
# These two shots also define the shared theme-flip anchors.
- url: http://127.0.0.1:8099/?s=workspace-chdman-light#/workspace/chdman
  output: docs/screenshots/workspace-chdman-light.png
  width: 1280
  height: 900
  wait: 1800
  javascript: &js_theme_light |
    (async () => {
      localStorage.setItem('theme-preference', 'light');
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: 'light' }));
      await new Promise(r => setTimeout(r, 500));
    })()
- url: http://127.0.0.1:8099/?s=workspace-chdman-dark#/workspace/chdman
  output: docs/screenshots/workspace-chdman-dark.png
  width: 1280
  height: 900
  wait: 1800
  javascript: &js_theme_dark |
    (async () => {
      localStorage.setItem('theme-preference', 'dark');
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: 'dark' }));
      await new Promise(r => setTimeout(r, 500));
    })()

# --- Workspace: batch selection (all files ticked, convert panel armed) ----
- url: http://127.0.0.1:8099/?s=workspace-batch-light#/workspace/chdman
  output: docs/screenshots/workspace-batch-light.png
  width: 1280
  height: 900
  wait: 1800
  javascript: |
    (async () => {
      localStorage.setItem('theme-preference', 'light');
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: 'light' }));
      await new Promise(r => setTimeout(r, 400));
      // Header select-all box. Matched structurally rather than by aria-label:
      // the label is state-dependent ("Select all on this page" /
      // "Deselect all on this page"), so a literal-text selector silently
      // stops matching whenever that wording changes.
      const all = document.querySelector('thead input[type="checkbox"]');
      if (all && !all.checked) all.click();
      await new Promise(r => setTimeout(r, 400));
    })()
- url: http://127.0.0.1:8099/?s=workspace-batch-dark#/workspace/chdman
  output: docs/screenshots/workspace-batch-dark.png
  width: 1280
  height: 900
  wait: 1800
  javascript: |
    (async () => {
      localStorage.setItem('theme-preference', 'dark');
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: 'dark' }));
      await new Promise(r => setTimeout(r, 400));
      // Header select-all box. Matched structurally rather than by aria-label:
      // the label is state-dependent ("Select all on this page" /
      // "Deselect all on this page"), so a literal-text selector silently
      // stops matching whenever that wording changes.
      const all = document.querySelector('thead input[type="checkbox"]');
      if (all && !all.checked) all.click();
      await new Promise(r => setTimeout(r, 400));
    })()

# --- Workspace: Dolphin (GameCube volume selected) -------------------------
- url: http://127.0.0.1:8099/?s=workspace-dolphin-light#/workspace/dolphin
  output: docs/screenshots/workspace-dolphin-light.png
  width: 1280
  height: 900
  wait: 1800
  javascript: |
    (async () => {
      localStorage.setItem('theme-preference', 'light');
      window.dispatchEvent(new StorageEvent('storage', { key: 'theme-preference', newValue: 'light' }));
      await new Promise(r => setTimeout(r, 400));
      const vol = [...document.querySelectorAll('button.item')].find(b => b.textContent.trim() === 'GameCube');
      if (vol) vol.click();
      await new Promise(r => setTimeout(r, 500));
    })()
