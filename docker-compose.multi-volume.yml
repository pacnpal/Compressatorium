version: '3.8'

# Example: Multiple game libraries with separate volume mounts
# Usage: docker-compose -f docker-compose.multi-volume.yml up -d

services:
  compressatorium:
    image: pacnpal/compressatorium:latest
    container_name: compressatorium-multi
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - CHD_MODE=webui
      # Auto-discover mounted volumes under this root (/data/*)
      - COMPRESSATORIUM_MOUNT_ROOT=/data
      # Optional: override temp location (default: /config/temp)
      # - CHD_TEMP_DIR=/temp
      # Optional: remap container runtime UID/GID (Unraid-friendly)
      # - PUID=99
      # - PGID=100
      - CHDMAN_MODE=createcd
      - MAX_CONCURRENT_JOBS=1
      - COMPRESSATORIUM_TOOL_NICE=10
      - COMPRESSATORIUM_TOOL_IOPRIO_CLASS=2
      - COMPRESSATORIUM_TOOL_IOPRIO_LEVEL=6
    volumes:
      # Required: Persistent config storage
      - ./config:/config
      # Optional: mount custom temp location (must match CHD_TEMP_DIR)
      # - ./temp:/temp
      # Map each host directory to its corresponding container path
      - ./games/dreamcast:/data/dreamcast
      - ./games/psp:/data/psp
      - ./games/ps1:/data/ps1
      - ./games/ps2:/data/ps2
    restart: unless-stopped
    # Resource limits (adjust based on your system)
    # NOTE (Synology / other CFS-less kernels): if the container fails to
    # start with "NanoCPUs can not be set, as your kernel does not support
    # CPU CFS scheduler or the cgroup is not mounted", the error covers two
    # distinct causes — DSM's known lack of CPU CFS bandwidth control, or (on
    # other hosts) a cgroup controller that simply isn't mounted, in which
    # case `cpuset` below may fail the same way. Delete/comment out the two
    # `cpus:` lines below (the `memory:` limits are unaffected and still
    # work; this leaves CPU usage unbounded), or replace them with a
    # top-level `cpuset: "0-1"` to pin specific cores instead. See
    # docs/DOCKER-COMPOSE.md#synology-dsm-and-other-cfs-less-kernels for the
    # full explanation, including how to check which cause applies to you.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 512M
